name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.repository.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Check configured distribution repository
        id: repository
        run: |
          repository=$(python3 scripts/distribution.py)
          if [[ "${GITHUB_REPOSITORY,,}" == "${repository,,}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: this checkout is not the configured distribution repository."
          fi
      - name: Prepare draft release
        if: steps.repository.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "TrayClip $GITHUB_REF_NAME" --notes "See the assets below to download and install."

  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --bundles dmg
            tauri-script: bash scripts/macos/package-dmg.sh
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --bundles dmg
            tauri-script: bash scripts/macos/package-dmg.sh
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb,rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb1-dev libxcb-xfixes0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for Rust tests
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Windows native dependency tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test OCR packaging
        run: python scripts/ocr/test-package-engine.py

      - name: Test main application without OCR runtime
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify main application excludes OCR inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked --prefix none --manifest-path src-tauri/Cargo.toml | grep -E '^(paddle-ocr-rs|ort|ort-sys|imageproc) v'; then
            echo "OCR inference dependencies leaked into the main application"
            exit 1
          fi

      - name: Reuse and verify immutable OCR release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ocr/reuse-engine.py --target ${{ matrix.target }} --output src-tauri/target/ocr-dist

      - name: Verify Windows installer icon
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Missing Windows installer icon: src-tauri/icons/icon.ico"
          }

      - name: Test macOS DMG packaging
        if: runner.os == 'macOS'
        run: bash scripts/macos/package-dmg.test.sh

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: ${{ matrix.tauri-script }}
          tagName: ${{ github.ref_name }}
          releaseName: TrayClip ${{ github.ref_name }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}
