<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
        (() => {
            let theme;
            try { theme = localStorage.getItem("trayclip-website-theme"); } catch {}
            const resolved = theme === "dark" || theme === "light" ? theme
                : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = resolved;
            document.documentElement.style.colorScheme = resolved;
            document.documentElement.style.backgroundColor = resolved === "dark" ? "#191a1d" : "#ffffff";
        })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="TrayClip 是轻量、本地优先的开源剪贴板管理工具。保存历史、搜索内容、分组置顶，支持离线 OCR 图片文字识别，为 Windows、macOS 和 Linux 提供下载入口。" />
    <meta property="og:title" content="TrayClip · 轻量、本地优先的剪贴板管理工具" />
    <meta property="og:description" content="保存剪贴板历史，搜索、分组、再次粘贴。支持离线 OCR 图片文字识别，图片不上传。" />
    <meta property="og:type" content="website" />
    <title>TrayClip · 轻量、本地优先的剪贴板管理工具</title>
    <link rel="icon" type="image/png" href="../public/logo.png" />
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
